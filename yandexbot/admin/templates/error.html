{% extends "base.html" if user else "auth_base.html" %}
{% block content %}
<section class="card">
  <div class="card-body stack">
    {% if not user %}<h1>{{ title }}</h1>{% endif %}
    <p>{{ message }}</p>
    <p><a class="btn secondary" href="{{ url_for('dashboard') }}">На главную</a></p>
  </div>
</section>
{% endblock %}
