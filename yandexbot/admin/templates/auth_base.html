<!doctype html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ title }} · Панель бота</title>
<link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
</head>
<body>
<main class="auth">
  <section class="card auth-card">
    <div class="brand">
      <div class="brand-mark">ЯБ</div>
      <div><b>Яндекс-бот</b><span>Панель управления</span></div>
    </div>
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category if category in ['success', 'error', 'info'] else 'info' }}" role="status" style="margin-bottom:14px">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </section>
</main>
</body>
</html>
